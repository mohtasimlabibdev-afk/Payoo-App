<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon" />

    <!-- tailwind css + daisi UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

      <!-- Font awsome icons -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

       <style>
            *{
                  font-family: "Outfit", sans-serif;
            }
       </style>

  </head>
  <body class="min-h-screen mx-auto max-w-md bg-base-200">

      <!-- Payoo Logo -->
      <div class="logo w-[263px] mx-auto pt-52">
            <img src="assets/Logo-full.png" alt="Payoo Logo">
      </div>

      <!-- login Form -->
       <section class="form pt-8">
            <div class="card bg-base-100 w-full mx-auto max-w-sm shrink-0 shadow rounded-[24px]">
      <div class="card-body">
        <fieldset class="fieldset">

            <!-- number -->
          <label class="label text-neutral font-medium">Mobile Number</label>
          <input id="input-number" type="text" class="input rounded-full bg-[#F4F5F7]
          border-none" placeholder="Enter your 11 digit number"/>

          <br>

            <!-- pin -->
          <label class="label text-neutral font-medium">4 Digit Pin</label>
          <input id="input-pin" type="password" class="input rounded-full border-none bg-[#F4F5F7]" placeholder="Enter 4 Digit Pin" />

          <button id="login-btn" class="btn btn-active btn-primary mt-4 text-[20px] font-semibold rounded-full">Login</button>
        </fieldset>
      </div>
    </div>
       </section>


       <script src="scripts/login.js"></script>
  </body>
</html>
